base_images:
  aro-hcp-e2e-tools:
    name: aro-hcp-e2e-tools
    namespace: aro-hcp
    tag: latest
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  unit:
    requests:
      cpu: 1000m
      memory: 4Gi
tests:
- as: delete-expired-kusto-role-assignments
  cron: 0 4 * * *
  steps:
    env:
      LEASE1_TYPE: aro-hcp-dev-quota-slice
    post:
    - ref: aro-hcp-lease-release
    pre:
    - ref: aro-hcp-lease-acquire
    test:
    - ref: aro-hcp-deprovision-kusto-role-assignments
- as: delete-expired-development-resource-groups
  cron: 7,37 * * * *
  steps:
    env:
      CLEANUP_MODE: no-rp
      LEASE1_TYPE: aro-hcp-dev-quota-slice
    post:
    - ref: aro-hcp-lease-release
    pre:
    - ref: aro-hcp-lease-acquire
    test:
    - ref: aro-hcp-deprovision-expired-resource-groups
- as: delete-expired-integration-resource-groups
  cron: 7,37 * * * *
  steps:
    env:
      LEASE1_TYPE: aro-hcp-int-quota-slice
      VAULT_SECRET_PROFILE: int
    post:
    - ref: aro-hcp-lease-release
    pre:
    - ref: aro-hcp-lease-acquire
    test:
    - ref: aro-hcp-deprovision-expired-resource-groups
- as: delete-expired-stage-resource-groups
  cron: 7,37 * * * *
  steps:
    env:
      LEASE1_TYPE: aro-hcp-stg-quota-slice
      VAULT_SECRET_PROFILE: stg
    post:
    - ref: aro-hcp-lease-release
    pre:
    - ref: aro-hcp-lease-acquire
    test:
    - ref: aro-hcp-deprovision-expired-resource-groups
- as: delete-expired-prod-resource-groups
  cron: 7,37 * * * *
  steps:
    env:
      LEASE1_TYPE: aro-hcp-prod-quota-slice
      VAULT_SECRET_PROFILE: prod
    post:
    - ref: aro-hcp-lease-release
    pre:
    - ref: aro-hcp-lease-acquire
    test:
    - ref: aro-hcp-deprovision-expired-resource-groups
- as: integration-e2e-parallel
  cron: 0 0 1 1 *
  steps:
    env:
      ARO_HCP_CLOUD: public
      ARO_HCP_DEPLOY_ENV: int
      ARO_HCP_SUITE_NAME: integration/parallel
      LEASE1_TYPE: aro-hcp-int-quota-slice
      LEASE2_COUNT: "20"
      LEASE2_FILE: leases-test-msi-containers
      LEASE2_TYPE: aro-hcp-test-msi-containers-int
      LOCATION: uksouth
      VAULT_SECRET_PROFILE: int
    workflow: aro-hcp-e2e
- as: stage-e2e-parallel
  cron: 0 2 * * *
  steps:
    env:
      ARO_HCP_CLOUD: public
      ARO_HCP_DEPLOY_ENV: stg
      ARO_HCP_SUITE_NAME: stage/parallel
      LEASE1_TYPE: aro-hcp-stg-quota-slice
      LEASE2_COUNT: "30"
      LEASE2_FILE: leases-test-msi-containers
      LEASE2_TYPE: aro-hcp-test-msi-containers-stg
      LOCATION: uksouth
      VAULT_SECRET_PROFILE: stg
    workflow: aro-hcp-e2e
- as: prod-e2e-parallel
  cron: 0 2 * * *
  steps:
    env:
      ARO_HCP_CLOUD: public
      ARO_HCP_DEPLOY_ENV: prod
      ARO_HCP_SUITE_NAME: prod/parallel
      LEASE1_TYPE: aro-hcp-prod-quota-slice
      LEASE2_COUNT: "15"
      LEASE2_FILE: leases-test-msi-containers
      LEASE2_TYPE: aro-hcp-test-msi-containers-prod
      LOCATION: uksouth
      VAULT_SECRET_PROFILE: prod
    workflow: aro-hcp-e2e
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: periodic
