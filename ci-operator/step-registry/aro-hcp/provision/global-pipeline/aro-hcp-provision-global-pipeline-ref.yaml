ref:
  as: aro-hcp-provision-global-pipeline
  from: aro-hcp-e2e-tools
  commands: aro-hcp-provision-global-pipeline-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
  credentials:
    - namespace: ci
      name: cluster-secrets-aro-hcp-dev
      mount_path: /var/run/aro-hcp-dev
    - namespace: ci
      name: cluster-secrets-aro-hcp-int
      mount_path: /var/run/aro-hcp-int
    - namespace: ci
      name: cluster-secrets-aro-hcp-stg
      mount_path: /var/run/aro-hcp-stg
    - namespace: ci
      name: cluster-secrets-aro-hcp-prod
      mount_path: /var/run/aro-hcp-prod
  env:
  - name: VAULT_SECRET_PROFILE
    default: "dev"
    documentation: |-
      Selects which environment's cluster secrets to use (dev, int, stg, prod).
  - name: DEPLOY_ENV
    default: "prow"
    documentation: The ARO HCP deploy environment to target for the global pipeline.
  - name: LOCATION
    default: "westus3"
    documentation: Azure region to use when rendering config for the global pipeline.
  - name: KUSTO_LOCATION
    default: "eastus2"
    documentation: Azure region used for the Log.Infra pipeline execution.
  - name: KUSTO_RESOURCE_GROUP
    default: "hcp-kusto-us"
    documentation: Kusto resource group to mark with persist=true after deployment.
  documentation: |-
    Run shared ARO HCP global infrastructure updates (Global pipeline, ACR, Kusto).
